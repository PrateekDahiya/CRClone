name: Unity Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: 2022.3.20f1
          cacheKey: unity-${{ runner.os }}-${{ hashFiles('Packages/**') }}

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Run EditMode Tests
        id: editmode
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults editmode-results.xml \
            -logFile - \
            -quit

      - name: Upload EditMode Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-test-results
          path: editmode-results.xml
          retention-days: 7

      - name: Parse EditMode Results
        if: always()
        run: |
          if [ -f editmode-results.xml ]; then
            echo "## EditMode Test Results" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@result)" editmode-results.xml 2>/dev/null || echo "Failed" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@total)" editmode-results.xml 2>/dev/null | xargs -I {} echo "Total: {}" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@passed)" editmode-results.xml 2>/dev/null | xargs -I {} echo "Passed: {}" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@failed)" editmode-results.xml 2>/dev/null | xargs -I {} echo "Failed: {}" >> $GITHUB_STEP_SUMMARY
          fi

  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: 2022.3.20f1
          cacheKey: unity-${{ runner.os }}-${{ hashFiles('Packages/**') }}

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Run PlayMode Tests
        id: playmode
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -runTests \
            -testPlatform PlayMode \
            -testResults playmode-results.xml \
            -logFile - \
            -quit

      - name: Upload PlayMode Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-test-results
          path: playmode-results.xml
          retention-days: 7

      - name: Parse PlayMode Results
        if: always()
        run: |
          if [ -f playmode-results.xml ]; then
            echo "## PlayMode Test Results" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@result)" playmode-results.xml 2>/dev/null || echo "Failed" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@total)" playmode-results.xml 2>/dev/null | xargs -I {} echo "Total: {}" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@passed)" playmode-results.xml 2>/dev/null | xargs -I {} echo "Passed: {}" >> $GITHUB_STEP_SUMMARY
            xmllint --xpath "string(//test-run/@failed)" playmode-results.xml 2>/dev/null | xargs -I {} echo "Failed: {}" >> $GITHUB_STEP_SUMMARY
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [editmode-tests, playmode-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: 2022.3.20f1
          cacheKey: unity-${{ runner.os }}-${{ hashFiles('Packages/**') }}

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Run Tests with Coverage
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults coverage-results.xml \
            -coverageResultsPath coverage.opencover.xml \
            -logFile - \
            -quit

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.opencover.xml
          flags: unity
          fail_ci_if_error: false

  # Quality Gates
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [editmode-tests, playmode-tests, coverage]
    if: always()
    steps:
      - name: Check EditMode Results
        run: |
          if [ "${{ needs.editmode-tests.result }}" != "success" ]; then
            echo "EditMode tests failed"
            exit 1
          fi

      - name: Check PlayMode Results
        run: |
          if [ "${{ needs.playmode-tests.result }}" != "success" ]; then
            echo "PlayMode tests failed"
            exit 1
          fi

      - name: Check Coverage Threshold
        run: |
          # Would parse coverage XML and check >80%
          echo "Coverage check passed (placeholder)"

      - name: Summary
        run: echo "All Unity quality gates passed!"