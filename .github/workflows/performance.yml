name: Performance Benchmarks

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  workflow_dispatch:
    inputs:
      compare_baseline:
        description: 'Compare against baseline'
        required: true
        default: 'true'
        type: boolean

jobs:
  unity-performance:
    name: Unity Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: 2022.3.20f1
          cacheKey: unity-${{ runner.os }}-${{ hashFiles('Packages/**') }}

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-

      - name: Run Simulation Benchmark
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults perf-simulation-results.xml \
            -logFile - \
            -quit \
            -testCategory "Performance.Simulation"

      - name: Run Memory Stability Test
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults perf-memory-results.xml \
            -logFile - \
            -quit \
            -testCategory "Performance.Memory"

      - name: Run Pathfinding Benchmark
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -runTests \
            -testPlatform EditMode \
            -testResults perf-pathfinding-results.xml \
            -logFile - \
            -quit \
            -testCategory "Performance.Pathfinding"

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: unity-performance-results
          path: perf-*-results.xml
          retention-days: 30

  server-load-test:
    name: Server Load Test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/k6-action@v0.2.0
        with:
          filename: server/tests/load/k6-load-test.js
          env: |
            SERVER_HOST=localhost
            WS_PORT=3001
            AUTH_TOKEN=loadtest_token

      - name: Start Test Services
        run: |
          docker-compose -f docker-compose.test.yml up -d mysql redis server
        env:
          DB_PASSWORD: test
          JWT_SECRET: test-secret

      - name: Wait for Server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 2
          done

      - name: Run k6 Load Test
        run: |
          k6 run --out json=load-test-results.json server/tests/load/k6-load-test.js
        env:
          SERVER_HOST: localhost
          WS_PORT: 3001
          AUTH_TOKEN: loadtest_token

      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: load-test-results.json
          retention-days: 30

      - name: Parse Load Test Results
        run: |
          if [ -f load-test-results.json ]; then
            echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
            cat load-test-results.json | jq -r '.metrics | to_entries[] | "\(.key): \(.value.values | to_entries[] | "\(.key)=\(.value)")"' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  regression-detection:
    name: Regression Detection
    runs-on: ubuntu-latest
    needs: [unity-performance, server-load-test]
    if: github.event.inputs.compare_baseline == 'true'
    steps:
      - name: Download Baseline Metrics
        uses: actions/download-artifact@v4
        with:
          name: performance-baseline
          path: ./baseline
        continue-on-error: true

      - name: Download Current Results
        uses: actions/download-artifact@v4
        with:
          name: unity-performance-results
          path: ./current/unity
        continue-on-error: true

      - name: Download Load Test Results
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-results
          path: ./current/load
        continue-on-error: true

      - name: Compare Simulation Performance
        run: |
          if [ -f baseline/simulation-benchmark.json ] && [ -f current/unity/perf-simulation-results.xml ]; then
            BASELINE=$(cat baseline/simulation-benchmark.json | jq '.avgMsPerTick')
            CURRENT=$(xmllint --xpath "string(//test-case/@time)" current/unity/perf-simulation-results.xml 2>/dev/null || echo "0")
            CURRENT_MS=$(echo "$CURRENT * 1000" | bc)
            
            REGRESSION=$(echo "scale=2; ($CURRENT_MS - $BASELINE) / $BASELINE * 100" | bc)
            
            echo "Baseline: ${BASELINE}ms, Current: ${CURRENT_MS}ms, Regression: ${REGRESSION}%" >> $GITHUB_STEP_SUMMARY
            
            if (( $(echo "$REGRESSION > 5" | bc -l) )); then
              echo "❌ PERFORMANCE REGRESSION DETECTED: ${REGRESSION}% slower than baseline"
              exit 1
            else
              echo "✅ No significant regression (${REGRESSION}%)"
            fi
          fi

      - name: Compare Load Test Performance
        run: |
          if [ -f baseline/load-test-results.json ] && [ -f current/load/load-test-results.json ]; then
            BASELINE_P99=$(cat baseline/load-test-results.json | jq '.metrics.ws_msg_duration.values.p99')
            CURRENT_P99=$(cat current/load/load-test-results.json | jq '.metrics.ws_msg_duration.values.p99')
            
            REGRESSION=$(echo "scale=2; ($CURRENT_P99 - $BASELINE_P99) / $BASELINE_P99 * 100" | bc)
            
            echo "Load Test p99 - Baseline: ${BASELINE_P99}ms, Current: ${CURRENT_P99}ms, Regression: ${REGRESSION}%" >> $GITHUB_STEP_SUMMARY
            
            if (( $(echo "$REGRESSION > 5" | bc -l) )); then
              echo "❌ LOAD TEST REGRESSION DETECTED: ${REGRESSION}% slower"
              exit 1
            else
              echo "✅ Load test performance stable"
            fi
          fi

      - name: Update Baseline (on main branch)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          # Create new baseline from current results
          mkdir -p ./new-baseline
          
          # Extract simulation benchmark
          if [ -f current/unity/perf-simulation-results.xml ]; then
            TIME=$(xmllint --xpath "string(//test-case/@time)" current/unity/perf-simulation-results.xml 2>/dev/null || echo "0")
            echo "{\"avgMsPerTick\": $(echo "$TIME * 1000" | bc)}" > ./new-baseline/simulation-benchmark.json
          fi
          
          # Copy load test results
          if [ -f current/load/load-test-results.json ]; then
            cp current/load/load-test-results.json ./new-baseline/load-test-results.json
          fi
          
          # Upload as new baseline artifact
          echo "New baseline prepared"

  # Store Baseline
  store-baseline:
    name: Store Performance Baseline
    runs-on: ubuntu-latest
    needs: [regression-detection]
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Download Current Results
        uses: actions/download-artifact@v4
        with:
          name: unity-performance-results
          path: ./current/unity

      - name: Download Load Test Results
        uses: actions/download-artifact@v4
        with:
          name: k6-load-test-results
          path: ./current/load

      - name: Prepare Baseline Artifact
        run: |
          mkdir -p ./baseline
          
          if [ -f current/unity/perf-simulation-results.xml ]; then
            TIME=$(xmllint --xpath "string(//test-case/@time)" current/unity/perf-simulation-results.xml 2>/dev/null || echo "0")
            echo "{\"avgMsPerTick\": $(echo "$TIME * 1000" | bc)}" > ./baseline/simulation-benchmark.json
          fi
          
          if [ -f current/load/load-test-results.json ]; then
            cp current/load/load-test-results.json ./baseline/load-test-results.json
          fi

      - name: Upload Baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: ./baseline/
          retention-days: 90