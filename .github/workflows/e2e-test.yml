name: E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Start Test Environment
        run: |
          docker-compose -f docker-compose.test.yml up -d --build
        env:
          DB_PASSWORD: test
          JWT_SECRET: test-secret

      - name: Wait for Services
        run: |
          # Wait for MySQL
          for i in {1..30}; do
            if docker-compose -f docker-compose.test.yml exec -T mysql mysqladmin ping -h localhost -u root -ptest 2>/dev/null; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done
          
          # Wait for Redis
          for i in {1..10}; do
            if docker-compose -f docker-compose.test.yml exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Redis ready"
              break
            fi
            sleep 1
          done
          
          # Wait for Server
          for i in {1..30}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 2
          done

      - name: Build Unity Client (Headless)
        run: |
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -buildTarget LinuxStandalone64 \
            -buildPath ./build/CRClone-Linux \
            -logFile - \
            -quit
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Setup Playwright
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./e2e
        run: npx playwright test --reporter=html
        env:
          BASE_URL: http://localhost:3000
          WS_URL: ws://localhost:3001

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./e2e/playwright-report/
          retention-days: 7

      - name: Upload Test Screenshots/Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: ./e2e/test-results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v

  # Critical Paths Only (Fast)
  critical-paths:
    name: Critical Paths Only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Minimal Test Env
        run: |
          docker-compose -f docker-compose.test.yml up -d mysql redis server
        env:
          DB_PASSWORD: test
          JWT_SECRET: test-secret

      - name: Wait for Services
        run: |
          sleep 15
          curl -f http://localhost:3000/health

      - name: Run Critical Path Tests
        working-directory: ./e2e
        run: npx playwright test --project=chromium --grep "Critical"
        env:
          BASE_URL: http://localhost:3000

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v