name: Dependency Check

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --audit-level=high --json > audit-results.json || true
          cat audit-results.json | jq '.metadata.vulnerabilities'

      - name: Check for Critical/High Vulnerabilities
        run: |
          CRITICAL=$(cat audit-results.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-results.json | jq '.metadata.vulnerabilities.high // 0')
          
          echo "Critical: $CRITICAL, High: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical and $HIGH high vulnerabilities"
            cat audit-results.json | jq -r '.advisories[] | select(.severity == "critical" or .severity == "high") | "\(.module_name)@\(.findings[0].version): \(.title) (\(.severity)) - \(.url)"'
            exit 1
          else
            echo "✅ No critical/high vulnerabilities found"
          fi

      - name: Upload Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: ./server/audit-results.json
          retention-days: 30

  unity-package-audit:
    name: Unity Package Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Unity
        uses: game-ci/unity-installer@v2
        with:
          unityVersion: 2022.3.20f1

      - name: Check Package Manifest
        run: |
          if [ -f "Packages/manifest.json" ]; then
            echo "Checking Unity packages..."
            cat Packages/manifest.json | jq -r '.dependencies | to_entries[] | "\(.key): \(.value)"'
            
            # Check for known vulnerable packages
            # This would integrate with a vulnerability database
            echo "Unity package audit completed (placeholder)"
          fi

      - name: Check for Deprecated Packages
        run: |
          if [ -f "Packages/manifest.json" ]; then
            # Check for packages marked as deprecated
            cat Packages/manifest.json | jq -r '.dependencies | to_entries[] | select(.value | contains("deprecated")) | "\(.key): \(.value)"' || true
          fi

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Server Licenses
        run: |
          cd server
          npx license-checker --json > licenses.json || true
          
          # Check for non-permissive licenses
          DISALLOWED="GPL|AGPL|SSPL|Commons Clause"
          VIOLATIONS=$(cat licenses.json | jq -r 'to_entries[] | select(.value.licenses | test("'$DISALLOWED'")) | "\(.key): \(.value.licenses)"' || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Disallowed licenses found:"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "✅ All licenses compliant"
          fi

      - name: Check Unity Asset Licenses
        run: |
          # Would check Assets/Plugins, Packages for license files
          echo "Unity asset license check completed (placeholder)"

  outdated-check:
    name: Outdated Dependencies Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Server Outdated
        working-directory: ./server
        run: |
          npm outdated --json > outdated.json || true
          
          MAJOR=$(cat outdated.json | jq '[.[] | select(.current | split(".")[0] < .latest | split(".")[0])] | length')
          MINOR=$(cat outdated.json | jq '[.[] | select(.current | split(".")[1] < .latest | split(".")[1])] | length')
          
          echo "Major updates available: $MAJOR"
          echo "Minor updates available: $MINOR"
          
          if [ "$MAJOR" -gt 5 ]; then
            echo "⚠️ Many major updates available - consider updating"
          fi

      - name: Check Unity Package Updates
        run: |
          # Unity Package Manager doesn't have a direct CLI for this
          # Would need to check via Unity Editor or manifest
          echo "Unity package update check (placeholder)"

  summary:
    name: Dependency Check Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, unity-package-audit, license-check, outdated-check]
    if: always()
    steps:
      - name: Check All Passed
        run: |
          FAILED=0
          
          if [ "${{ needs.npm-audit.result }}" != "success" ]; then
            echo "❌ npm audit failed"
            FAILED=1
          fi
          
          if [ "${{ needs.unity-package-audit.result }}" != "success" ]; then
            echo "❌ Unity package audit failed"
            FAILED=1
          fi
          
          if [ "${{ needs.license-check.result }}" != "success" ]; then
            echo "❌ License check failed"
            FAILED=1
          fi
          
          if [ "${{ needs.outdated-check.result }}" != "success" ]; then
            echo "❌ Outdated check failed"
            FAILED=1
          fi
          
          if [ "$FAILED" -eq 1 ]; then
            echo "Dependency checks failed!"
            exit 1
          fi
          
          echo "✅ All dependency checks passed"