name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Client (Unity Headless)
        run: |
          # Build Unity headless client for Linux
          /opt/unity/Editor/Unity -batchmode -nographics \
            -projectPath . \
            -buildTarget LinuxStandalone64 \
            -buildPath ./build/CRClone-Linux \
            -logFile - \
            -quit
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.inputs.environment == 'staging' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          # Using docker-compose for staging
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml up -d --remove-orphans
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository }}/server:${{ needs.build-and-push.outputs.image-tag }}
          CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client:${{ needs.build-and-push.outputs.image-tag }}

      - name: Health Check
        run: |
          for i in {1..30}; do
            if curl -f http://staging.crclone.com/health > /dev/null 2>&1; then
              echo "Staging deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed"
          exit 1

      - name: Run Smoke Tests
        run: |
          # Quick API tests
          curl -f http://staging.crclone.com/api/v1/health
          curl -f http://staging.crclone.com/api/v1/status

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.event.inputs.environment == 'production'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: tech-leads,release-managers
          minimum-approvals: 2
          issue-title: "Production Deployment Approval - ${{ github.sha }}"
          issue-body: |
            Deploying version ${{ needs.build-and-push.outputs.image-tag }} to production.
            Staging deployment: ✅ Successful
            
            Please review and approve.

      - name: Deploy to Production
        run: |
          # Blue-green deployment
          docker-compose -f docker-compose.prod.yml pull
          
          # Start new version (green)
          docker-compose -f docker-compose.prod.yml -f docker-compose.prod.green.yml up -d
          
          # Health check new version
          for i in {1..30}; do
            if curl -f http://green.crclone.com/health > /dev/null 2>&1; then
              echo "Green deployment healthy"
              break
            fi
            sleep 10
          done
          
          # Switch traffic (update nginx/load balancer)
          # This would update the upstream config
          
          # Stop old version (blue)
          docker-compose -f docker-compose.prod.yml -f docker-compose.prod.blue.yml down
        env:
          SERVER_IMAGE: ghcr.io/${{ github.repository }}/server:${{ needs.build-and-push.outputs.image-tag }}

      - name: Post-Deployment Verification
        run: |
          # Run critical path tests against production
          sleep 30
          curl -f https://crclone.com/health
          curl -f https://crclone.com/api/v1/status

      - name: Notify Deployment
        run: |
          # Send to Slack/Discord
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"🚀 Production deployment successful: ${{ needs.build-and-push.outputs.image-tag }}"}'