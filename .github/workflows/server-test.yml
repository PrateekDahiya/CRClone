name: Server Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: crclone_test
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test -- --testPathPattern=unit --coverage
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: crclone_test
          DB_USERNAME: root
          DB_PASSWORD: test
          DB_SSL: "false"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Upload Unit Test Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/lcov.info
          flags: server-unit
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: crclone_test
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize Test Database
        run: |
          mysql -h localhost -u root -ptest crclone_test < ../../server/sql/init.sql
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: crclone_test
          DB_USERNAME: root
          DB_PASSWORD: test

      - name: Run Integration Tests
        run: npm run test -- --testPathPattern=integration --runInBand
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: crclone_test
          DB_USERNAME: root
          DB_PASSWORD: test
          DB_SSL: "false"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
          NODE_ENV: test

  # Quality Gates
  quality-gates:
    name: Server Quality Gates
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Check Unit Tests
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi

      - name: Check Integration Tests
        run: |
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "Integration tests failed"
            exit 1
          fi

      - name: Check Coverage > 80%
        run: |
          # Parse lcov and verify
          if [ -f ./server/coverage/lcov.info ]; then
            COVERAGE=$(awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2} END {if(lf>0) print int(lh/lf*100); else print 100}' ./server/coverage/lcov.info)
            echo "Coverage: ${COVERAGE}%"
            if [ "$COVERAGE" -lt 80 ]; then
              echo "Coverage below 80% threshold"
              exit 1
            fi
          fi

      - name: Summary
        run: echo "All Server quality gates passed!"