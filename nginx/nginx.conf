user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;

  upstream game_servers {
    least_conn;
    server server-1:3000 max_fails=3 fail_timeout=30s;
    server server-2:3000 max_fails=3 fail_timeout=30s;
    server server-3:3000 max_fails=3 fail_timeout=30s;
  }

  upstream ws_servers {
    ip_hash;
    server server-1:3001 max_fails=3 fail_timeout=30s;
    server server-2:3001 max_fails=3 fail_timeout=30s;
    server server-3:3001 max_fails=3 fail_timeout=30s;
  }

  include /etc/nginx/conf.d/*.conf;
}
